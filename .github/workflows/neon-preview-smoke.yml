# P1-12 live check: creates and deletes the Neon branch preview/pr-0 through the composite action.
# Runs on same-repo PRs that touch the action. Superseded by ci.yml (P1-15); delete it then.
name: neon-preview-smoke

on:
  pull_request:
    paths:
      - .github/actions/neon-preview/**
      - .github/workflows/neon-preview-smoke.yml

permissions: {}

concurrency:
  group: neon-preview-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Create preview/pr-0
        id: neon
        uses: ./.github/actions/neon-preview
        with:
          mode: create
          pr_number: "0"
          project_id: ${{ vars.NEON_CI_PROJECT_ID }}
          role_to_assume: ${{ vars.AWS_ROLE_CI_ARN }}

      - name: Branch was created
        env:
          BRANCH_ID: ${{ steps.neon.outputs.branch_id }}
          EXPIRES_AT: ${{ steps.neon.outputs.expires_at }}
        run: |
          test -n "$BRANCH_ID"
          echo "branch id $BRANCH_ID, expires $EXPIRES_AT"

      - name: Delete preview/pr-0
        if: always()
        uses: ./.github/actions/neon-preview
        with:
          mode: delete
          pr_number: "0"
          project_id: ${{ vars.NEON_CI_PROJECT_ID }}
