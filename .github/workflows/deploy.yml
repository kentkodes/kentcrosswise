# Deploy main to prod (DESIGN §4.2 step 8; P1-16): migrate, prod build, Lambda bundles, terraform
# apply infra/prod (which uploads the OpenNext build and the agent Lambda code), clear the CloudFront
# cache (O6), then smoke-check the live site against this build's id.
# Runs in GitHub environment `prod`, so the OIDC subject is ...:environment:prod (kcw-gh-deploy).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time, never cancelled mid-apply. A newer pending run replaces an older pending one,
# so the latest main is what gets deployed.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  NEXT_TELEMETRY_DISABLED: "1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  deploy:
    name: deploy
    # Manual runs must also be on main: only main is deployed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: prod
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_domain_name: ${{ vars.KCW_DOMAIN_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          terraform: "true"

      - name: AWS credentials (kcw-gh-deploy)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      # Direct (non-pooled) URL of migrator_app in kcw/prod/migrator (docs/runbooks/prod-db.md).
      # A missing or broken URL fails the deploy (DESIGN §11).
      - name: Migrate prod
        run: pnpm migrate --secret kcw/prod/migrator

      # Prod build; build-web also fails if the preview login is in the bundle.
      - name: Prod build
        run: pnpm build-web

      # Orchestrator, webhook relay, sweeper and essay watcher Lambda code (agents/*/dist*,
      # scripts/dist-pipelines; read by infra/prod). All four must bundle and load, even while
      # pipelines_deployed is false.
      - name: Lambda bundles
        run: pnpm build-lambdas

      - name: Terraform init infra/prod
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform -chdir=infra/prod init -backend-config="bucket=$TF_STATE_BUCKET"

      - name: Terraform apply infra/prod
        run: terraform -chdir=infra/prod apply -auto-approve -lock-timeout=10m

      - name: Prod URL
        id: url
        run: |
          url="$(terraform -chdir=infra/prod output -raw url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      # O6: prerendered pages carry s-maxage of a year, so a deploy must clear the edge cache.
      # "/*" counts as one invalidation path. Waits until CloudFront reports it completed.
      - name: Clear the CloudFront cache
        run: |
          dist="$(terraform -chdir=infra/prod output -raw distribution_id)"
          id="$(aws cloudfront create-invalidation --distribution-id "$dist" --paths '/*' --query Invalidation.Id --output text)"
          echo "Invalidation $id on $dist" >> "$GITHUB_STEP_SUMMARY"
          aws cloudfront wait invalidation-completed --distribution-id "$dist" --id "$id"

      - name: Smoke check (public pages show this build, /hub redirects to sign-in)
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
        run: pnpm smoke-check --url "$BASE_URL" --attempts 20 --delay 15 --build-file apps/web/.open-next/kcw-build.json
