name: essay-ingest
run-name: essay ingest ${{ inputs.book_ids }}

on:
  workflow_dispatch:
    inputs:
      book_ids:
        description: "Space-separated Gutenberg book ids (each must be an approved link)"
        type: string
        required: true

permissions: {}

concurrency:
  group: essay-ingest
  cancel-in-progress: false

jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    environment: essay-ingest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      BOOK_IDS: ${{ inputs.book_ids }}
    steps:
      - name: Validate book ids
        run: |
          set -eu
          n=0
          for id in $BOOK_IDS; do
            if ! printf '%s' "$id" | grep -Eq '^[1-9][0-9]{0,6}$'; then
              echo "invalid book id"
              exit 1
            fi
            n=$((n + 1))
          done
          if [ "$n" -eq 0 ]; then
            echo "no book ids"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Ensure rsync
        run: command -v rsync >/dev/null || sudo apt-get install -y rsync
      - name: Fetch from the Gutenberg mirror
        run: pnpm essay-ingest --phase fetch --ids "$BOOK_IDS" --dir "$RUNNER_TEMP/gutenberg"
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        if: vars.AWS_ROLE_ESSAY_INGEST_ARN != ''
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ESSAY_INGEST_ARN }}
          aws-region: us-east-1
      - name: Store
        if: vars.AWS_ROLE_ESSAY_INGEST_ARN != ''
        env:
          KCW_BUCKET: kentcrosswise-pipelines-${{ vars.AWS_ACCOUNT_ID }}
        run: pnpm essay-ingest --phase store --ids "$BOOK_IDS" --dir "$RUNNER_TEMP/gutenberg" --bucket "$KCW_BUCKET" --secret kcw/prod/pipeline --confirm
