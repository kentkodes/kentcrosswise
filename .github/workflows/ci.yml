# CI for every pull request (DESIGN §4.2 step 4, §5; P1-15).
#   checks     lint, typecheck, unit tests, Next build, terraform fmt (+ repo settings check, non-blocking)
#   candidate-build  same-repo PRs only: runs the candidate's migrate, seed and preview build with NO
#              credentials (no id-token, no secrets, no AWS) and uploads them as the data-only artifact
#              `candidate-preview`. .github/workflows/preview-trusted.yml (workflow_run, defined by main)
#              verifies it and provisions the preview in a separate trusted run; no pull_request job can
#              assume kcw-gh-ci (AR1 slice 2).
#   candidate-prod-build  same-repo PRs only, also credential-free: prod build + Lambda bundles as the data-only
#              artifact `candidate-prod` (the Terraform inputs of infra/prod). preview-trusted.yml verifies it and
#              runs the prod plan that feeds merge-rules from main's definition (AR1 slice 3).
#   required   the aggregate check `ci/required` that the main ruleset requires
#
# No job here assumes an AWS role or reads a secret. The prod plan runs only in the trusted `prod-plan` job of
# preview-trusted.yml (kcw-gh-plan trusts only environment:prod-plan, main-only); the advisory plan that ran
# candidate code beside the plan role was removed on 2026-11-17. Fork PRs get `checks` only.
#
# Cancelled runs: a new push cancels the running CI for that PR (concurrency below). The preview itself is
# provisioned and torn down by preview-trusted.yml; preview-gc.yml removes leftovers when the PR closes and
# nightly (> 24 h).
name: ci

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  NEXT_TELEMETRY_DISABLED: "1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cache: only credential-free pull_request jobs (checks, candidate-build) use the pnpm cache; see .github/actions/setup.
      - uses: ./.github/actions/setup
        with:
          terraform: "true"
          cache: "true"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Next.js build
        run: pnpm --filter web build

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      # P1-17: compares the main ruleset with scripts/repo-settings/ (profile: repo variable
      # KCW_RULESET_PROFILE, default interim). Non-blocking until Phase 2 manages the ruleset.
      - name: Repo settings (non-blocking)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE: ${{ vars.KCW_RULESET_PROFILE || 'interim' }}
          KCW_ORCHESTRATOR_APP_ID: ${{ vars.KCW_ORCHESTRATOR_APP_ID }}
        run: pnpm check-repo-settings --profile "$PROFILE"

  # AR1 slice 2: all candidate code that used to run beside AWS/Neon credentials runs here
  # instead, with none. Output is data for preview-trusted.yml: a Postgres dump of the migrated + seeded
  # candidate schema, the OpenNext preview build as a tar, and a manifest binding them to this run.
  candidate-build:
    name: candidate-build
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      # Major 17: the Neon CI project's version is not recorded in the repo (set this to match it).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # OUT_DIR is set per step: the runner context is not available in job-level env.
    env:
      REPOSITORY_ID: ${{ github.repository_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: "true"

      - name: Migrate and seed the service database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm migrate
          pnpm seed

      # The runner's default client is older than 17; pg_dump must not be older than the server.
      - name: PostgreSQL 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      # Plain SQL with INSERTs (no COPY): the trusted side restores it as one simple query, not through psql.
      - name: Dump the database (preview-db.sql)
        env:
          PGPASSWORD: postgres
          OUT_DIR: ${{ runner.temp }}/candidate
        run: |
          mkdir -p "$OUT_DIR"
          /usr/lib/postgresql/17/bin/pg_dump --host localhost --username postgres --dbname postgres --no-owner --no-privileges --clean --if-exists --inserts --file "$OUT_DIR/preview-db.sql"

      - name: Preview build (KCW_ENV=preview)
        env:
          KCW_ENV: preview
        run: pnpm build-web

      # Uncompressed pax tar (the artifact zip compresses it; pnpm paths exceed ustar limits). atime/ctime are
      # dropped to keep headers small; the trusted side accepts only path/mtime/atime/ctime pax records.
      - name: Archive the build (preview-web.tar)
        env:
          OUT_DIR: ${{ runner.temp }}/candidate
        run: tar --format=pax --pax-option=delete=atime,delete=ctime -cf "$OUT_DIR/preview-web.tar" -C apps/web .open-next

      - name: Manifest (candidate-manifest.json)
        env:
          OUT_DIR: ${{ runner.temp }}/candidate
        run: pnpm candidate-manifest --dir "$OUT_DIR"

      # Early warning only (this job is candidate-controlled; the trusted verify job is the authority): the
      # same validator the trusted side runs, so link entries or limit overruns fail this PR before merge.
      - name: Self-check the artifact with the trusted validator
        env:
          OUT_DIR: ${{ runner.temp }}/candidate
        run: pnpm verify-candidate verify --dir "$OUT_DIR"

      - name: Upload candidate-preview
        uses: actions/upload-artifact@v7
        with:
          name: candidate-preview
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 3

  # AR1 slice 3: the prod build the trusted prod plan (preview-trusted.yml) plans with. Same shape as
  # candidate-build: no credentials, data-only output. Allowed tar roots: PROD_ROOTS in scripts/lib/candidate-artifact.ts.
  candidate-prod-build:
    name: candidate-prod-build
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      REPOSITORY_ID: ${{ github.repository_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: "true"

      # Prod build; build-web also fails if the preview login is in the bundle.
      - name: Prod build
        run: pnpm build-web

      - name: Lambda bundles
        run: pnpm build-lambdas

      # Uncompressed pax tar from the repo root (same options as candidate-build); the paths are the fixed PROD_ROOTS.
      - name: Archive the build (prod-build.tar)
        env:
          OUT_DIR: ${{ runner.temp }}/candidate-prod
        run: |
          mkdir -p "$OUT_DIR"
          tar --format=pax --pax-option=delete=atime,delete=ctime -cf "$OUT_DIR/prod-build.tar" apps/web/.open-next agents/orchestrator/dist agents/orchestrator/dist-sweeper agents/webhook-relay/dist scripts/dist-pipelines

      - name: Manifest (candidate-manifest.json)
        env:
          OUT_DIR: ${{ runner.temp }}/candidate-prod
        run: pnpm candidate-manifest --kind prod --dir "$OUT_DIR"

      # Early warning only (the trusted verify job is the authority), as in candidate-build.
      - name: Self-check the artifact with the trusted validator
        env:
          OUT_DIR: ${{ runner.temp }}/candidate-prod
        run: pnpm verify-candidate verify --kind prod --dir "$OUT_DIR"

      - name: Upload candidate-prod
        uses: actions/upload-artifact@v7
        with:
          name: candidate-prod
          path: ${{ runner.temp }}/candidate-prod/
          if-no-files-found: error
          retention-days: 3

  required:
    name: ci/required
    needs: [checks, candidate-build, candidate-prod-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          CHECKS: ${{ needs.checks.result }}
          CANDIDATE: ${{ needs['candidate-build'].result }}
          CANDIDATE_PROD: ${{ needs['candidate-prod-build'].result }}
        run: |
          echo "checks=$CHECKS candidate-build=$CANDIDATE candidate-prod-build=$CANDIDATE_PROD same-repo=$SAME_REPO"
          test "$CHECKS" = success
          if [ "$SAME_REPO" = true ]; then
            test "$CANDIDATE" = success
            test "$CANDIDATE_PROD" = success
          else
            echo "Fork PR: candidate-build and candidate-prod-build do not run."
          fi
