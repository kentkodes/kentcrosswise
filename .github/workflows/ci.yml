# CI for every pull request (DESIGN §4.2 step 4, §5; P1-15).
#   checks     lint, typecheck, unit tests, Next build, terraform fmt (+ repo settings check, non-blocking)
#   preview    same-repo PRs only: Neon branch + migrate + seed, preview build, terraform apply
#              infra/preview, Playwright against it, then teardown in the same job (if: always())
#   candidate-build  same-repo PRs only, AR1 slice 2 (shadow): runs the candidate's migrate, seed and preview
#              build with NO credentials (no id-token, no secrets, no AWS) and uploads them as the data-only
#              artifact `candidate-preview`. .github/workflows/preview-trusted.yml (workflow_run, defined by
#              main) verifies it and provisions the preview in a separate trusted run. Replaces `preview` in PR B.
#   prod-plan  same-repo PRs only: prod build + Lambda bundles, read-only prod plan; summary artifact, and
#              the merge-rules-input artifact (plan summary + lockfile diff) the orchestrator fetches
#   required   the aggregate check `ci/required` that the main ruleset requires
#
# Fork PRs get `checks` only: no AWS role, no secrets (and the role trust would refuse them anyway).
#
# Cancelled runs: a new push cancels the running CI for that PR (concurrency below). The preview
# teardown steps use `if: always()`, so they still run in the cancelled job. If they are cut short
# (or a runner dies), the next CI run of the PR removes its own stale preview first ("Stale
# preview" steps), and preview-gc.yml removes leftovers when the PR closes and nightly (> 24 h).
name: ci

on:
  pull_request:

permissions: {}

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  NEXT_TELEMETRY_DISABLED: "1"
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # cache: only credential-free pull_request jobs (checks, candidate-build) use the pnpm cache; see .github/actions/setup.
      - uses: ./.github/actions/setup
        with:
          terraform: "true"
          cache: "true"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Next.js build
        run: pnpm --filter web build

      - name: Terraform format
        run: terraform fmt -check -recursive infra

      # P1-17: compares the main ruleset with scripts/repo-settings/ (profile: repo variable
      # KCW_RULESET_PROFILE, default interim). Non-blocking until Phase 2 manages the ruleset.
      - name: Repo settings (non-blocking)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE: ${{ vars.KCW_RULESET_PROFILE || 'interim' }}
          KCW_ORCHESTRATOR_APP_ID: ${{ vars.KCW_ORCHESTRATOR_APP_ID }}
        run: pnpm check-repo-settings --profile "$PROFILE"

  preview:
    name: preview
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      id-token: write
      contents: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      NEON_CI_PROJECT_ID: ${{ vars.NEON_CI_PROJECT_ID }}
      TF_VAR_domain_name: ${{ vars.KCW_DOMAIN_NAME }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          terraform: "true"

      - name: AWS credentials (kcw-gh-ci)
        id: aws
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_CI_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      # Exports KCW_CI_NEON_API_KEY (kcw/ci) and KCW_E2E_E2E_LOGIN (kcw/ci/e2e-login), masked, to the
      # later steps of this job.
      - name: Read kcw/ci and kcw/ci/e2e-login
        uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            KCW_CI, kcw/ci
            KCW_E2E, kcw/ci/e2e-login
          parse-json-secrets: true

      - name: Preview build (KCW_ENV=preview)
        env:
          KCW_ENV: preview
        run: pnpm build-web

      - name: Terraform init (preview/pr-${{ github.event.pull_request.number }}.tfstate)
        id: tfinit
        run: >-
          terraform -chdir=infra/preview init
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=preview/pr-$PR_NUMBER.tfstate"

      - name: Stale preview from an earlier run?
        id: stale
        run: pnpm preview-gc find --pr "$PR_NUMBER" --force

      - name: Stale preview - destroy
        if: steps.stale.outputs.has_state == 'true'
        env:
          TF_VAR_database_url: unused-on-destroy
        run: terraform -chdir=infra/preview destroy -auto-approve -lock-timeout=5m -var "pr_number=$PR_NUMBER"

      - name: Stale preview - delete Neon branch
        if: steps.stale.outputs.has_branch == 'true'
        run: pnpm preview-gc delete-neon --pr "$PR_NUMBER"

      - name: Neon branch preview/pr-${{ github.event.pull_request.number }}
        id: neon
        uses: ./.github/actions/neon-preview
        with:
          mode: create
          pr_number: ${{ github.event.pull_request.number }}
          project_id: ${{ vars.NEON_CI_PROJECT_ID }}

      - name: Migrate and seed the branch
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url }}
        run: |
          pnpm migrate
          pnpm seed

      - name: Terraform apply infra/preview
        id: apply
        env:
          TF_VAR_database_url: ${{ steps.neon.outputs.db_url }}
        run: terraform -chdir=infra/preview apply -auto-approve -lock-timeout=5m -var "pr_number=$PR_NUMBER"

      - name: Preview URL
        id: url
        run: |
          url="$(terraform -chdir=infra/preview output -raw url)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the preview
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
        run: pnpm smoke-check --url "$BASE_URL" --attempts 20 --delay 15 --build-file apps/web/.open-next/kcw-build.json

      - name: Playwright browsers
        run: |
          # apt mirrors on the runner sometimes fail DNS for a few minutes; retry instead of failing the preview.
          for attempt in 1 2 3; do
            pnpm --filter web exec playwright install --with-deps chromium && exit 0
            echo "::warning::Playwright browser install failed (attempt $attempt/3)"
            [ "$attempt" -lt 3 ] && sleep 30
          done
          exit 1

      # No report or trace upload: a trace would contain the typed preview login token.
      - name: Playwright against the preview
        env:
          BASE_URL: ${{ steps.url.outputs.url }}
          KCW_E2E_LOGIN: ${{ env.KCW_E2E_E2E_LOGIN }}
        run: pnpm --filter web e2e

      # ---------- teardown: runs on success, failure and cancellation ----------

      - name: Teardown - refresh AWS credentials
        if: always() && steps.aws.outcome == 'success'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_CI_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      - name: Teardown - terraform destroy
        id: destroy
        if: always() && steps.tfinit.outcome == 'success'
        continue-on-error: true
        env:
          TF_VAR_database_url: unused-on-destroy
        run: terraform -chdir=infra/preview destroy -auto-approve -lock-timeout=5m -var "pr_number=$PR_NUMBER"

      # Only after a successful destroy: without the state, nothing could remove what is left.
      - name: Teardown - delete the state object
        if: always() && steps.destroy.outcome == 'success'
        continue-on-error: true
        run: aws s3 rm "s3://$TF_STATE_BUCKET/preview/pr-$PR_NUMBER.tfstate"

      - name: Teardown - delete the Neon branch
        if: always() && steps.aws.outcome == 'success'
        continue-on-error: true
        run: pnpm preview-gc delete-neon --pr "$PR_NUMBER"

      # The authority on teardown: fails the job if anything of pr-<n> is left. Retries cover the
      # tagging API, which lists deleted resources for about a minute.
      - name: Teardown - check nothing is left
        if: always() && steps.aws.outcome == 'success'
        run: pnpm check-preview-clean --pr "$PR_NUMBER" --retries 5 --retry-delay 30

  # AR1 slice 2 (PR A, shadow): all candidate code that used to run beside AWS/Neon credentials runs here
  # instead, with none. Output is data for preview-trusted.yml: a Postgres dump of the migrated + seeded
  # candidate schema, the OpenNext preview build as a tar, and a manifest binding them to this run.
  candidate-build:
    name: candidate-build
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      # Major 17: the Neon CI project's version is not recorded in the repo (set this to match it).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # OUT_DIR is set per step: the runner context is not available in job-level env.
    env:
      REPOSITORY_ID: ${{ github.repository_id }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: "true"

      - name: Migrate and seed the service database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          pnpm migrate
          pnpm seed

      # The runner's default client is older than 17; pg_dump must not be older than the server.
      - name: PostgreSQL 17 client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      # Plain SQL with INSERTs (no COPY): the trusted side restores it as one simple query, not through psql.
      - name: Dump the database (preview-db.sql)
        env:
          PGPASSWORD: postgres
          OUT_DIR: ${{ runner.temp }}/candidate
        run: |
          mkdir -p "$OUT_DIR"
          /usr/lib/postgresql/17/bin/pg_dump --host localhost --username postgres --dbname postgres --no-owner --no-privileges --clean --if-exists --inserts --file "$OUT_DIR/preview-db.sql"

      - name: Preview build (KCW_ENV=preview)
        env:
          KCW_ENV: preview
        run: pnpm build-web

      # Uncompressed pax tar (the artifact zip compresses it; pnpm paths exceed ustar limits). atime/ctime are
      # dropped to keep headers small; the trusted side accepts only path/mtime/atime/ctime pax records.
      - name: Archive the build (preview-web.tar)
        env:
          OUT_DIR: ${{ runner.temp }}/candidate
        run: tar --format=pax --pax-option=delete=atime,delete=ctime -cf "$OUT_DIR/preview-web.tar" -C apps/web .open-next

      - name: Manifest (candidate-manifest.json)
        env:
          OUT_DIR: ${{ runner.temp }}/candidate
        run: pnpm candidate-manifest --dir "$OUT_DIR"

      # Early warning only (this job is candidate-controlled; the trusted verify job is the authority): the
      # same validator the trusted side runs, so link entries or limit overruns fail this PR before merge.
      - name: Self-check the artifact with the trusted validator
        env:
          OUT_DIR: ${{ runner.temp }}/candidate
        run: pnpm verify-candidate verify --dir "$OUT_DIR"

      - name: Upload candidate-preview
        uses: actions/upload-artifact@v7
        with:
          name: candidate-preview
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 3

  prod-plan:
    name: prod-plan
    needs: checks
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_domain_name: ${{ vars.KCW_DOMAIN_NAME }}
    steps:
      # fetch-depth 2: the PR merge commit and its parents; HEAD^1 is the base branch (lockfile diff).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: ./.github/actions/setup
        with:
          terraform: "true"

      # Prod build; build-web also fails if the preview login is in the bundle.
      - name: Prod build
        run: pnpm build-web

      # Orchestrator, webhook relay and sweeper Lambda code (agents/*/dist*, read by infra/prod).
      - name: Lambda bundles
        run: pnpm build-lambdas

      - name: AWS credentials (kcw-gh-plan, read-only)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_ARN }}
          aws-region: us-east-1

      - name: Terraform init infra/prod
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: terraform -chdir=infra/prod init -backend-config="bucket=$TF_STATE_BUCKET"

      # -lock=false: the plan role cannot write the lock object, and a plan changes nothing.
      - name: Terraform plan infra/prod
        run: terraform -chdir=infra/prod plan -lock=false -out=prod.tfplan

      # The plan JSON contains sensitive values in clear text: it is summarized, then deleted, never uploaded.
      - name: Plan summary
        run: |
          terraform -chdir=infra/prod show -json prod.tfplan > "$RUNNER_TEMP/prod-plan.json"
          pnpm plan-summary --plan-json "$RUNNER_TEMP/prod-plan.json" --out "$RUNNER_TEMP/prod-plan-summary.json" --markdown "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/prod-plan.json" infra/prod/prod.tfplan

      - name: Upload plan summary (for merge-rules)
        uses: actions/upload-artifact@v7
        with:
          name: prod-plan-summary
          path: ${{ runner.temp }}/prod-plan-summary.json
          if-no-files-found: error
          retention-days: 30

      # P2-13: plan summary + lockfile diff in one file for the orchestrator (merge-rules). Name and
      # shape are MERGE_INPUT_ARTIFACT / MERGE_INPUT_FILE in @kcw/core/merge-input. The base lockfile
      # is the first parent of the PR merge commit (checkout fetch-depth 2).
      - name: Merge-rules input
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "base sha (event)=$BASE_SHA merge parent=$(git rev-parse HEAD^1)"
          git show HEAD^1:pnpm-lock.yaml > "$RUNNER_TEMP/base-pnpm-lock.yaml"
          pnpm merge-input --plan-summary "$RUNNER_TEMP/prod-plan-summary.json" --base-lock "$RUNNER_TEMP/base-pnpm-lock.yaml" --head-lock pnpm-lock.yaml --out "$RUNNER_TEMP/merge-rules-input.json" --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload merge-rules input
        uses: actions/upload-artifact@v7
        with:
          name: merge-rules-input
          path: ${{ runner.temp }}/merge-rules-input.json
          if-no-files-found: error
          retention-days: 30

  required:
    name: ci/required
    needs: [checks, preview, candidate-build, prod-plan]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: All required jobs passed
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          CHECKS: ${{ needs.checks.result }}
          PREVIEW: ${{ needs.preview.result }}
          CANDIDATE: ${{ needs['candidate-build'].result }}
          PLAN: ${{ needs['prod-plan'].result }}
        run: |
          echo "checks=$CHECKS preview=$PREVIEW candidate-build=$CANDIDATE prod-plan=$PLAN same-repo=$SAME_REPO"
          test "$CHECKS" = success
          if [ "$SAME_REPO" = true ]; then
            test "$PREVIEW" = success
            test "$CANDIDATE" = success
            test "$PLAN" = success
          else
            echo "Fork PR: preview and prod plan do not run."
          fi
