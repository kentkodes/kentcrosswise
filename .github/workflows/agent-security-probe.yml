# TEMPORARY: owner-reviewed controlled probe; delete after evidence collection.
# Self-contained stdlib/AWS CLI only. No checkout, model, npm install or artifacts.
# Optional fixed-null queue canary is OFF unless explicitly selected after deployed-parser review.
name: agent-security-probe
on:
  workflow_dispatch:
    inputs:
      mode:
        description: main tests or protected-environment rejection on an identical reviewed branch/tag
        type: choice
        options: [main, blocked-ref]
        default: main
        required: true
      reviewed_sha:
        description: Exact owner-reviewed SHA containing this workflow, including on a branch/tag
        type: string
        required: true
      queue_canary:
        description: Opt in only after deployed-parser review; sends exactly one fixed null per publisher
        type: boolean
        default: false
        required: false
permissions: {}
concurrency:
  group: agent-security-probe
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: none
    env:
      PROBE_ENABLED: ${{ vars.KCW_AGENT_WORKFLOWS_ENABLED }}
      PROBE_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      PROBE_MODE: ${{ inputs.mode }}
      PROBE_QUEUE_CANARY: ${{ inputs.queue_canary }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_AGENT_DEVELOPER_ARN: ${{ vars.AWS_ROLE_AGENT_DEVELOPER_ARN }}
      AWS_ROLE_AGENT_QA_ARN: ${{ vars.AWS_ROLE_AGENT_QA_ARN }}
      AWS_ROLE_AGENT_SCRAPER_ARN: ${{ vars.AWS_ROLE_AGENT_SCRAPER_ARN }}
      AWS_ROLE_AGENT_DOCS_ARN: ${{ vars.AWS_ROLE_AGENT_DOCS_ARN }}
      AWS_ROLE_CI_ARN: ${{ vars.AWS_ROLE_CI_ARN }}
      AWS_ROLE_PLAN_ARN: ${{ vars.AWS_ROLE_PLAN_ARN }}
      AWS_ROLE_DEPLOY_ARN: ${{ vars.AWS_ROLE_DEPLOY_ARN }}
      PROBE_KIND: preflight
    steps:
      - name: Run reviewed probe without checkout or dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          """Temporary owner-reviewed probe. No models, installs, checkout or artifacts.

          Only run as the embedded source of the reviewed temporary workflow. Tests mock all I/O.
          Never print exceptions, HTTP/CLI bodies, credentials, JWTs or secret values.
          """
          import base64
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import tempfile
          import urllib.parse
          import urllib.request

          ACCOUNT = "619888736396"
          REGION = "us-east-1"
          QUEUE_URL = "https://sqs.us-east-1.amazonaws.com/619888736396/kcw-prod-orchestrator-in.fifo"
          REPOSITORY = "kentkodes/kentcrosswise"
          SUBJECT = "repo:kentkodes@107236483/kentcrosswise@1430035147"
          AGENTS = ("developer", "qa", "scraper", "docs")
          ROLES = {agent: f"kcw-gh-agent-{agent}" for agent in AGENTS}
          ROLES.update({"ci": "kcw-gh-ci", "plan": "kcw-gh-plan", "deploy": "kcw-gh-deploy"})
          ROLE_VARIABLES = {name: f"AWS_ROLE_{'AGENT_' if name in AGENTS else ''}{name.upper()}_ARN" for name in ROLES}
          DENIED = {"AccessDenied", "AccessDeniedException"}


          def emit(case, passed, message_id=None):
              result = {"case": case, "status": "PASS" if passed else "FAIL"}
              if message_id is not None:
                  if not re.fullmatch(r"[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}", message_id):
                      raise RuntimeError("invalid message identifier")
                  result["message_id"] = message_id
              print(json.dumps(result), flush=True)
              if not passed:
                  raise RuntimeError("probe failed")


          def preflight(env):
              emit("agents-remain-disabled", env.get("PROBE_ENABLED") != "true")
              emit("debug-disabled", env.get("RUNNER_DEBUG", "") != "1")
              emit("repository-identity", env.get("GITHUB_REPOSITORY") == REPOSITORY
                   and env.get("GITHUB_REPOSITORY_ID") == "1430035147"
                   and env.get("GITHUB_REPOSITORY_OWNER_ID") == "107236483")
              emit("reviewed-source-sha", bool(re.fullmatch(r"[0-9a-f]{40}", env.get("PROBE_REVIEWED_SHA", "")))
                   and env["PROBE_REVIEWED_SHA"] == env.get("GITHUB_SHA"))
              mode, ref = env.get("PROBE_MODE"), env.get("GITHUB_REF", "")
              emit("dispatch-ref", (mode == "main" and ref == "refs/heads/main")
                   or (mode == "blocked-ref" and ref != "refs/heads/main"
                       and (ref.startswith("refs/heads/") or ref.startswith("refs/tags/"))))
              canary = env.get("PROBE_QUEUE_CANARY", "false")
              emit("canary-explicit-opt-in", canary in {"false", "true"} and (canary != "true" or mode == "main"))
              if canary == "true":
                  emit("canary-run-identity", bool(re.fullmatch(r"[0-9]{1,20}", env.get("GITHUB_RUN_ID", "")))
                       and bool(re.fullmatch(r"[0-9]{1,5}", env.get("GITHUB_RUN_ATTEMPT", ""))))
              emit("account", env.get("AWS_ACCOUNT_ID") == ACCOUNT)
              for name, role in ROLES.items():
                  emit(f"configured-role-{name}", env.get(ROLE_VARIABLES[name]) == f"arn:aws:iam::{ACCOUNT}:role/{role}")


          def oidc(env, audience, agent=None):
              parsed = urllib.parse.urlsplit(env["ACTIONS_ID_TOKEN_REQUEST_URL"])
              emit("oidc-endpoint", parsed.scheme == "https"
                   and (parsed.hostname or "").endswith(".actions.githubusercontent.com"))
              query = dict(urllib.parse.parse_qsl(parsed.query))
              query["audience"] = audience
              url = urllib.parse.urlunsplit(parsed._replace(query=urllib.parse.urlencode(query)))
              request = urllib.request.Request(url, headers={"Authorization": f"Bearer {env['ACTIONS_ID_TOKEN_REQUEST_TOKEN']}"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  token = json.loads(response.read(2_000_000))["value"]
              segment = token.split(".")[1]
              claims = json.loads(base64.urlsafe_b64decode(segment + "=" * (-len(segment) % 4)))
              expected = f"{SUBJECT}:environment:agent-publish-{agent}" if agent else f"{SUBJECT}:ref:refs/heads/main"
              # Claim decoding is a diagnostic assertion only. AWS verifies the JWT signature.
              emit("oidc-claims", claims.get("aud") == audience and claims.get("sub") == expected
                   and claims.get("ref") == env["GITHUB_REF"] and claims.get("repository_id") == "1430035147")
              return token


          class Aws:
              def __init__(self, env):
                  self.executable = shutil.which("aws", path=env.get("PATH"))
                  emit("aws-cli-available", self.executable is not None)
                  # No inherited credential chain, endpoint override, debug flag or shell configuration.
                  self.env = {key: env[key] for key in ("PATH", "HOME", "LANG") if key in env}
                  self.env.update(AWS_REGION=REGION, AWS_DEFAULT_REGION=REGION, AWS_PAGER="",
                                  AWS_CLI_AUTO_PROMPT="off", AWS_EC2_METADATA_DISABLED="true",
                                  AWS_CONFIG_FILE="/dev/null", AWS_SHARED_CREDENTIALS_FILE="/dev/null")

              def call(self, args, credentials=None, discard=False):
                  child_env = dict(self.env)
                  if credentials:
                      child_env.update(AWS_ACCESS_KEY_ID=credentials["AccessKeyId"],
                                       AWS_SECRET_ACCESS_KEY=credentials["SecretAccessKey"],
                                       AWS_SESSION_TOKEN=credentials["SessionToken"])
                  result = subprocess.run([self.executable, *args, "--no-cli-pager", "--output", "json"],
                                          env=child_env, stdin=subprocess.DEVNULL,
                                          stdout=subprocess.DEVNULL if discard else subprocess.PIPE,
                                          stderr=subprocess.PIPE, check=False, timeout=60)
                  if result.returncode == 0:
                      return True, None if discard else json.loads(result.stdout or b"{}")
                  # Keep raw stderr private. A transport/config error is never a successful denial.
                  error = re.search(rb"An error occurred \(([A-Za-z0-9]+)\)", result.stderr)
                  return False, error.group(1).decode("ascii") if error else "UNCLASSIFIED"

              def assume_web(self, token, role):
                  descriptor, name = tempfile.mkstemp(prefix="kcw-probe-oidc-")
                  try:
                      with os.fdopen(descriptor, "w", encoding="utf8") as stream:
                          stream.write(token)
                      return self.call(["sts", "assume-role-with-web-identity", "--role-arn", role,
                                        "--role-session-name", "kcw-security-probe", "--duration-seconds", "900",
                                        "--web-identity-token", f"file://{name}"])
                  finally:
                      Path(name).unlink(missing_ok=True)


          def negative_assumption(aws, token, role, case, wrong_audience=False):
              ok, result = aws.assume_web(token, role)
              permitted_errors = DENIED | ({"InvalidIdentityToken"} if wrong_audience else set())
              emit(case, not ok and result in permitted_errors)


          def probe(env):
              preflight(env)
              kind = env.get("PROBE_KIND")
              if kind == "preflight":
                  return
              # If this line runs for blocked-ref, GitHub admitted a forbidden deployment: fail before OIDC.
              emit("environment-admission-main-only", env.get("GITHUB_REF") == "refs/heads/main")
              emit("known-probe-kind", kind in {"work", "publisher"})
              agent = env.get("PROBE_AGENT") if kind == "publisher" else None
              emit("known-agent", agent in AGENTS if kind == "publisher" else True)
              aws = Aws(env)
              token = oidc(env, "sts.amazonaws.com", agent)
              roles = {name: env[variable] for name, variable in ROLE_VARIABLES.items()}
              for name, role in roles.items():
                  if name != agent:
                      negative_assumption(aws, token, role, f"{kind}-{agent or 'none'}-cannot-assume-{name}")
              if kind == "work":
                  return
              bad_token = oidc(env, "kcw-security-probe.invalid", agent)
              negative_assumption(aws, bad_token, roles[agent], f"{agent}-wrong-audience-denied", wrong_audience=True)
              ok, session = aws.assume_web(token, roles[agent])
              emit(f"{agent}-own-role", ok)
              emit("issued-role-identity", session["AssumedRoleUser"]["Arn"].startswith(
                  f"arn:aws:sts::{ACCOUNT}:assumed-role/{ROLES[agent]}/"))
              credentials = session["Credentials"]
              for key in AGENTS:
                  ok, error = aws.call(["secretsmanager", "get-secret-value", "--secret-id", f"kcw/github/{key}-app"],
                                       credentials=credentials, discard=True)
                  emit(f"{agent}-key-{key}", ok if key == agent else not ok and error in DENIED)
              # Check role chaining with the publisher credentials, not another web identity token.
              for name, role in roles.items():
                  ok, error = aws.call(["sts", "assume-role", "--role-arn", role, "--role-session-name", "kcw-probe-denied"],
                                       credentials=credentials, discard=True)
                  emit(f"{agent}-no-role-chaining-{name}", not ok and error in DENIED)
              if env.get("PROBE_QUEUE_CANARY", "false") == "true":
                  # Fixed non-object body is acknowledged/dropped before any task lookup by the
                  # reviewed deployed parser. Owner/QA must verify that deployment before opting in.
                  group = f"kcw-security-probe-{env['GITHUB_RUN_ID']}-{agent}"
                  dedupe = f"{group}-{env['GITHUB_RUN_ATTEMPT']}"
                  ok, response = aws.call(["sqs", "send-message", "--queue-url", QUEUE_URL, "--message-body", "null",
                                    "--message-group-id", group, "--message-deduplication-id", dedupe],
                                   credentials=credentials)
                  message_id = response.get("MessageId") if ok and isinstance(response, dict) else None
                  emit(f"{agent}-fixed-null-queue-canary", ok and isinstance(message_id, str), message_id=message_id)
              else:
                  print(json.dumps({"case": "sqs-send-message", "status": "NOT_RUN", "reason": "canary-disabled"}))


          if __name__ == "__main__":
              try:
                  probe(dict(os.environ))
              except Exception:
                  # Deliberately omit exception text/tracebacks: SDK/CLI/HTTP failures can carry secrets.
                  print('{"case":"probe-completion","status":"FAIL"}', flush=True)
                  raise SystemExit(1)
          PY
